server:
 port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/Config
  config:
    import: "optional:configserver:"

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false