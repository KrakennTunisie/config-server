spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iam_db
    username: postgres
    password: "postgres"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
        ddl-auto: validate
        show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  Kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: >
          mailRequest:com.krakennTunisie.IAM_server.infrastructure.out.persistence.dto.MailRequest,
          auditEvent:com.krakennTunisie.IAM_server.infrastructure.out.messaging.AuditEvent

