spring:
  application:
    name: audit-service

  management:
    endpoints:
      web:
        exposure:
          include: "info,health"
  servlet:
    context-path: /api/audit-service
    multipart:
      max-file-size: 15MB
      max-request-size: 45MB

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false


  feign:
    client:
      config:
        billing-service:
          connect-timeout: 3000
          read-timeout: 5000
          logger-level: basic
server:
  servlet:
    context-path: /api/audit-service
  port: 8087
