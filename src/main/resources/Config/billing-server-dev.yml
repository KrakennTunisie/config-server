spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing_db
    username: postgres
    password: "postgres"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  kafka:
    bootstrap-servers: localhost:9094

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  storage:
    type: database
    local:
      root-path: ./storage
      public-base-url: http://localhost:8081
    cloud:
      provider: r2
    database:
      download-path: /api/billing/documents/


logging:
  level:
    org.springframework.web: DEBUG
    root: info