spring:
  datasource:
    url: jdbc:postgresql://notification-db:5432/notification_service_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true


  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: >
          mailResult:com.kerp.notificationservice.domain.model.MailSendResult

    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
        spring.json.type.mapping: >
          notificationEvent:com.kerp.notificationservice.domain.records.NotificationEvent,
          mailRequest:com.kerp.notificationservice.domain.model.MailJob

  rabbitmq:
    host: rabbit-mq
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

keycloak:
  url: ${KEYCLOAK_NOTIF_URL}

feign:
  client:
    config:
      billing-service:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: basic


