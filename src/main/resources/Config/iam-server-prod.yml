spring:
  datasource:
    url: jdbc:postgresql://iam-db:5432/iam_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: false

  kafka:
    bootstrap-servers: kafka:9092

keycloak:
  auth-server-url: ${KEYCLOAK_URL}
  client-secret: ${KEYCLOAK_SECRET}

logging:
  level:
    root: info
    com.KrakennTunisie.IAM_server: INFO
