spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_service_db
    username: postgres
    password: "Mes2021**"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: audit-service
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
        spring.json.type.mapping: >
          auditEvent:com.kerp.auditservice.domain.model.AuditEventPayload


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  feign:
    client:
      config:
        billing-service:
          connect-timeout: 3000
          read-timeout: 5000
          logger-level: basic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  servlet:
    context-path: /api/audit-service
  port: 8087

logging:
  level:
    root: info
    com.KrakennTunisie.IAM_server: DEBUG